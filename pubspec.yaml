name: skirlfield_app
description: SkirlField field staff app — duty, GPS tracking, attendance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # networking + storage
  dio: ^5.8.0
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  # device + location
  geolocator: ^14.0.0
  permission_handler: ^13.0.0
  battery_plus: ^7.0.0
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0
  # app
  provider: ^6.1.2
  uuid: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
